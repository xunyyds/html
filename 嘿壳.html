<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>视频播放器 - 高清鉴赏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 避免拖动时误选文字，不影响交互 */
        }

        body {
            background: #0a0a0a;
            background-image: radial-gradient(circle at 15% 30%, rgba(30,30,40,0.6) 0%, #000000 95%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            padding: 20px;
        }

        /* 优雅卡片容器 */
        .video-card {
            max-width: 1280px;
            width: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(2px);
            border-radius: 32px;
            padding: 20px 20px 24px 20px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
        }

        /* 视频容器 — 确保宽高比优雅，且背景纯黑无溢出 */
        .video-wrapper {
            position: relative;
            background: #000000;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            line-height: 0;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            cursor: pointer;
            background: #000;
            outline: none;
            /* 让视频控件现代简洁 */
        }

        /* 自定义控件区域美化：原生controls已经很友好，但可以增加底栏说明 */
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            flex-wrap: wrap;
            gap: 12px;
            padding: 0 8px;
        }

        .video-title {
            font-size: 0.9rem;
            font-weight: 500;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 40px;
            letter-spacing: 0.3px;
            color: #f0f0f0;
            border: 0.5px solid rgba(255,255,255,0.2);
            font-family: monospace;
            word-break: break-all;
        }

        .status-badge {
            font-size: 0.75rem;
            background: rgba(0,0,0,0.6);
            padding: 5px 12px;
            border-radius: 50px;
            color: #9effcf;
            font-weight: 400;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(2px);
        }

        .status-badge::before {
            content: "●";
            font-size: 10px;
            color: #2ecc71;
            text-shadow: 0 0 2px #00ff9d;
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; text-shadow: 0 0 0 #2ecc71;}
            100% { opacity: 1; text-shadow: 0 0 4px #2ecc71;}
        }

        .footer-note {
            margin-top: 18px;
            text-align: center;
            font-size: 0.75rem;
            color: #aaa;
            background: rgba(0,0,0,0.3);
            padding: 10px 16px;
            border-radius: 60px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            backdrop-filter: blur(2px);
            transition: 0.2s;
        }

        .footer-note a {
            color: #6ea8fe;
            text-decoration: none;
            border-bottom: 1px dotted rgba(110,168,254,0.5);
        }

        .footer-note a:hover {
            color: white;
            border-bottom-color: white;
        }

        /* 移动端小调整 */
        @media (max-width: 640px) {
            .video-card {
                padding: 12px;
                border-radius: 24px;
            }
            .video-title {
                font-size: 0.7rem;
                padding: 4px 12px;
            }
            .status-badge {
                font-size: 0.65rem;
                padding: 3px 10px;
            }
            .footer-note {
                font-size: 0.65rem;
            }
        }

        /* 优雅加载占位指示 (如果视频加载慢，背景黑色配合微光) */
        .video-wrapper::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            z-index: -1;
            pointer-events: none;
        }

        /* 让原生video控件更贴近设计 */
        video::-webkit-media-controls-panel {
            background-image: linear-gradient(to top, rgba(0,0,0,0.7), rgba(0,0,0,0.3));
        }
    </style>
</head>
<body>
<div class="video-card">
    <div class="video-wrapper">
        <!-- 
            视频源地址已修正为您提供的 GitHub raw 原始链接。
            注意：raw.githubusercontent.com 域名直接用于 <video> 可能存在跨域资源限制或 MIME 类型问题，
            但大部分现代浏览器对于 mp4 支持良好，且 raw.githubusercontent.com 支持 Range 请求，通常可以正常播放。
            如果遇到无法加载，可替换为 raw.githack.com 转换后的链接，但为了稳定与您的需求，优先保留原始链接。
            同时增加了 autoplay、muted、playsinline 保证移动端自动播放策略合规，循环播放可选但未开启。
            用户可手动控制，体验最佳。
        -->
        <video 
            id="mainVideo"
            controls 
            autoplay 
            muted 
            playsinline 
            preload="auto"
            poster="" 
            aria-label="视频播放器"
        >
            <!-- 源地址: 您提供的原始 GitHub raw 链接，已正确配置 -->
            <source src="https://raw.githubusercontent.com/xunyyds/pic/main/137649199_da2-1-192_3.mp4" type="video/mp4">
            <!-- 额外备用兼容提示 -->
            您的浏览器不支持 HTML5 视频播放。请升级浏览器或使用现代浏览器如 Chrome, Edge, Safari。
        </video>
    </div>

    <div class="info-panel">
        <div class="video-title">
            📹 视频源 · GitHub 仓库
        </div>
        <div class="status-badge">
            在线资源 · 即播体验
        </div>
    </div>
    <div class="footer-note">
        💡 提示：若视频无法自动播放（浏览器策略），点击播放按钮即可。<br>
        🚀 视频直链：<a href="https://raw.githubusercontent.com/xunyyds/pic/main/137649199_da2-1-192_3.mp4" target="_blank" rel="noopener noreferrer">raw.githubusercontent.com/xunyyds/pic/main/137649199_da2-1-192_3.mp4</a>
        <span style="display: inline-block; margin-left: 6px;">✨ 支持全屏及进度控制</span>
    </div>
</div>

<script>
    (function() {
        // 保证视频加载健壮性，自动处理潜在的错误重试或提示
        const videoElem = document.getElementById('mainVideo');
        if (!videoElem) return;

        // 处理加载错误 (比如网络波动或者raw限制)
        videoElem.addEventListener('error', (e) => {
            const error = videoElem.error;
            let errorMsg = '视频加载失败。';
            if (error) {
                switch (error.code) {
                    case 1:
                        errorMsg = '视频加载中断，请检查网络后刷新重试。';
                        break;
                    case 2:
                        errorMsg = '网络错误，无法获取视频资源。';
                        break;
                    case 3:
                        errorMsg = '视频解码错误，可能格式不支持。';
                        break;
                    case 4:
                        errorMsg = '视频地址无效或链接不可访问。';
                        break;
                    default:
                        errorMsg = '未知错误，可尝试手动点击链接下载观看。';
                }
            }
            // 优雅显示错误浮层但不用 alert 影响体验，在控制台输出，同时可更新状态栏
            console.warn('[Video Error]', errorMsg, videoElem.src);
            const badgeSpan = document.querySelector('.status-badge');
            if (badgeSpan) {
                badgeSpan.style.backgroundColor = 'rgba(180, 60, 50, 0.7)';
                badgeSpan.style.color = '#ffc9c9';
                badgeSpan.innerHTML = '⚠️ 视频加载异常 · 点击重试';
                badgeSpan.style.cursor = 'pointer';
                badgeSpan.addEventListener('click', () => {
                    // 重新加载视频源
                    const currentSrc = videoElem.querySelector('source')?.src || videoElem.src;
                    if (currentSrc) {
                        videoElem.load(); 
                        badgeSpan.innerHTML = '🔄 重新加载中 ...';
                        badgeSpan.style.backgroundColor = 'rgba(0,0,0,0.6)';
                        setTimeout(() => {
                            if (videoElem.readyState === 0) {
                                // 如果还不行，保留提示
                                badgeSpan.innerHTML = '⚠️ 请检查网络后刷新页面';
                            } else {
                                badgeSpan.innerHTML = '✅ 视频重新加载';
                                setTimeout(() => {
                                    badgeSpan.innerHTML = '🎬 在线资源 · 即播体验';
                                    badgeSpan.style.color = '#9effcf';
                                }, 2000);
                            }
                        }, 1500);
                    }
                });
            }
        });

        // 加载成功时更新状态为优雅展示
        videoElem.addEventListener('canplaythrough', () => {
            const badgeSpan = document.querySelector('.status-badge');
            if (badgeSpan && badgeSpan.innerHTML.includes('异常')) {
                badgeSpan.innerHTML = '🎬 在线资源 · 即播体验';
                badgeSpan.style.backgroundColor = 'rgba(0,0,0,0.6)';
                badgeSpan.style.color = '#9effcf';
            }
        });

        // 额外辅助：由于自动播放静音策略，用户首次点击页面任意位置可尝试解除静音? 不强制，但提供良好的交互引导。
        // 给视频增加一点便捷性：如果用户点击视频区域，并且视频处于静音状态且未开始播放（autoplay被阻止），可尝试播放一次
        // 提升用户体验，尤其移动端
        let userInteracted = false;
        const tryPlayOnInteraction = () => {
            if (userInteracted) return;
            userInteracted = true;
            if (videoElem.paused && videoElem.muted) {
                // 用户首次点击，尝试播放并且解除静音（但保留用户选择，仅做一次辅助）
                videoElem.play().then(() => {
                    // 如果自动播放成功，可选择性取消静音（但尊重用户，不强制，用户可自行点击音量）
                    // 仅仅为了某些移动端浏览器需要手势才能播放，做了友好尝试。
                    console.log('用户交互启动播放');
                }).catch(err => {
                    // 静默失败，至少用户手动点击控件也能播放
                    console.log('播放需要手动控制', err);
                });
            }
        };
        document.body.addEventListener('click', tryPlayOnInteraction, { once: true });
        // 同时视频本身点击也算
        videoElem.addEventListener('click', () => {
            if (videoElem.paused) {
                videoElem.play().catch(e => console.log('click play', e));
            }
        });

        // 预检链接可用性（可选，发送head请求不影响性能，不做额外强校验，交给浏览器原生机制）
        // 为了美观，如果视频加载缓慢，可以显示提示，不需要额外loading，浏览器自带loading。
        
        // 修正iOS全屏播放小贴士: playsinline 已经支持
        // 额外确保 raw.githubusercontent.com 的链接支持CORS? 但video不受严格CORS影响，可以播放。
        // 若遇到部分网络无法播放，footer-note中提供了原始链接可下载验证。
        
        // 额外性能：检测视频源是否支持range请求（断点续传），浏览器自动处理
        // 根据用户提供的地址是 mp4 直接链接，大多数情况完美播放。
        // 移除默认poster（无图更干净）
        
        // 若由于github raw偶尔限速或访问慢，增加友好重试机制（可选简单）
        let retryCount = 0;
        const maxRetries = 1; // 最多额外重试一次，避免过度请求
        videoElem.addEventListener('stalled', () => {
            // 当视频下载停滞，尝试重新加载源
            if (retryCount < maxRetries && videoElem.networkState === 2) {
                retryCount++;
                console.log('视频流停滞，尝试重新加载');
                videoElem.load();
            }
        });
        
        // 如果视频因为某些原因无法加载，并且在5秒后仍然没有数据，提供柔和重试提示但不自动无限循环
        let loadTimeout = setTimeout(() => {
            if (videoElem.readyState === 0 && !videoElem.error) {
                const badgeSpan = document.querySelector('.status-badge');
                if (badgeSpan && !badgeSpan.innerHTML.includes('异常')) {
                    badgeSpan.innerHTML = '⏳ 连接较慢，可点击刷新重试';
                    badgeSpan.style.cursor = 'pointer';
                    badgeSpan.onclick = () => {
                        videoElem.load();
                        badgeSpan.innerHTML = '🔄 重新加载中...';
                        setTimeout(() => {
                            if (videoElem.readyState === 0 && !videoElem.error) {
                                badgeSpan.innerHTML = '🔁 请检查网络或手动下载观看';
                            } else {
                                badgeSpan.innerHTML = '🎬 在线资源 · 即播体验';
                            }
                        }, 2000);
                    };
                }
            }
        }, 6000);
        
        // 一旦视频可以播放或者有进度，清除超时提醒
        videoElem.addEventListener('loadeddata', () => {
            if (loadTimeout) clearTimeout(loadTimeout);
            const badgeSpan = document.querySelector('.status-badge');
            if (badgeSpan && badgeSpan.innerHTML.includes('较慢')) {
                badgeSpan.innerHTML = '🎬 在线资源 · 即播体验';
                badgeSpan.style.cursor = 'default';
                badgeSpan.onclick = null;
            }
        });
        
        // 清理定时器 (防止内存)
        window.addEventListener('beforeunload', () => {
            if (loadTimeout) clearTimeout(loadTimeout);
        });
        
        // 添加辅助功能：视频全屏时样式平滑
        videoElem.addEventListener('webkitbeginfullscreen', () => {});
        
        // 保证自动播放的静音策略适配：静音 autoplay 基本所有现代浏览器支持，加上 playsinline 移动端也能自动播放静音视频
        // 如果有用户手动点击取消静音, 完美
        console.log('视频播放器已准备，源地址: ' + (videoElem.querySelector('source')?.src || '未知'));
    })();
</script>
</body>
</html>
